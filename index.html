<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Gamer.us.ci</title>
    <style>
        body { background: #0d1117; color: white; font-family: sans-serif; margin: 0; text-align: center; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; padding: 20px; }
        .card { background: #161b22; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; text-decoration: none; display: block; transition: 0.3s; }
        .card:hover { transform: scale(1.05); border-color: #00d2ff; }
        .card img { width: 100%; height: 100px; object-fit: cover; }
        .title { padding: 8px; color: #eee; font-size: 11px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="grid" id="container"></div>
    <script>
        const repoUrl = 'https://api.github.com/repos/Kamin7/games/contents/';
        async function load() {
            try {
                const res = await fetch(repoUrl);
                const data = await res.json();
                const folders = data.filter(i => i.type === 'dir' && !i.name.startsWith('.'));
                const container = document.getElementById('container');
                folders.forEach(f => {
                    const card = document.createElement('a');
                    card.className = 'card';
                    card.href = `./${f.name}/index.html`;
                    card.innerHTML = `
                        <img src="./${f.name}/thumbnail.png" onerror="this.src='https://placehold.co/200x150/161b22/00d2ff?text=${f.name}'">
                        <div class="title">${f.name.replace(/-/g, ' ')}</div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) { console.error(e); }
        }
        load();
    </script>
</body>
</html>
